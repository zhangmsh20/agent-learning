name: Course checks

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dependency-free course tests
        run: python -m unittest discover -s 实操 -p 'test_*.py' -v
      - name: Compile examples
        run: python -m compileall -q 实操
